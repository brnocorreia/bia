[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brnocorreia/bia"
publish = false

[workspace.dependencies]
bia-core = { path = "crates/bia-core" }
bia-store = { path = "crates/bia-store" }
bia-engine = { path = "crates/bia-engine" }
bia-actions = { path = "crates/bia-actions" }
bia-server = { path = "crates/bia-server" }
bia-client = { path = "crates/bia-client" }

sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
disallowed_methods = "warn"

[package]
name = "bia-client"
description = "Typed HTTP client for the bia API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bia-core.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde"] }

[lints]
workspace = true

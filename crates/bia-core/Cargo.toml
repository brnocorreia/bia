[package]
name = "bia-core"
description = "DSL types, JSON Schema, Expressions, validation and the Action trait. No IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
jsonschema = { version = "0.59.0", default-features = false }

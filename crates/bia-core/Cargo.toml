[package]
name = "bia-core"
description = "DSL types, JSON Schema, Expressions, validation and the Action trait. No IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
cel = { version = "0.15.0", default-features = false, features = ["chrono", "regex", "ext_encoders", "parser_pratt"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
jsonschema = { version = "0.59.0", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["sync"], optional = true }
tokio-util = { version = "0.7.20", default-features = false }

[features]
# The fake Action and the manual Clock, for tests in this and later crates.
testing = ["dep:tokio"]

[lints]
workspace = true

[dev-dependencies]
bia-core = { path = ".", features = ["testing"] }
insta = { version = "1.49.0", features = ["json"] }
tokio = { version = "1.53.3", features = ["rt", "macros"] }

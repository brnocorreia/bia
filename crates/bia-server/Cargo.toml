[package]
name = "bia-server"
description = "HTTP API, OpenAPI, Scopes, webhooks and the MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
bia-core.workspace = true
bia-store.workspace = true
bia-engine.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde"] }
json-patch = "4.2.0"

[dev-dependencies]
bia-client.workspace = true
bia-core = { workspace = true, features = ["testing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
schemars = "1.2.3"
tokio = { version = "1.53.3", features = ["macros", "rt", "net", "time"] }
wiremock = "0.6.5"

[lints]
workspace = true

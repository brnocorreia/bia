[package]
name = "bia-server"
description = "HTTP API, OpenAPI, Scopes, webhooks and the MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
bia-core.workspace = true
bia-store.workspace = true
bia-engine.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net"] }
tracing = "0.1.44"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
bia-client.workspace = true
bia-core = { workspace = true, features = ["testing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
schemars = "1.2.3"
tokio = { version = "1.53.3", features = ["macros", "rt", "net"] }

[lints]
workspace = true

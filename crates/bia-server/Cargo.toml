[package]
name = "bia-server"
description = "HTTP API, OpenAPI, Scopes, webhooks and the MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Embeds the UI bundle (`ui/dist`, built with `just ui-build`) and serves it from the root.
ui = ["dep:rust-embed"]
# Lets a test build a metadata fetcher that reaches loopback servers. Never enabled in a build
# that ships: the production fetcher refuses every address that is not public (ADR-0067).
testing = []

[dependencies]
rust-embed = { version = "8.13.0", optional = true, default-features = false, features = ["debug-embed", "interpolate-folder-path", "mime-guess"] }
axum = { version = "0.8.9", features = ["macros"] }
bia-core.workspace = true
bia-store.workspace = true
bia-engine.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "rt"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde"] }
json-patch = "4.2.0"
percent-encoding = "2.3.2"
tower = { version = "0.5.3", features = ["util"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
argon2 = "0.6.0"
subtle = "2.6.1"
url = "2.5.8"
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
bia-client.workspace = true
bia-core = { workspace = true, features = ["testing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form"] }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.3"
tokio = { version = "1.53.3", features = ["macros", "rt", "net", "time"] }
wiremock = "0.6.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }

# Needs the relaxed metadata fetchers only the `testing` feature builds (`--all-features`, as
# `just test` runs it).
[[test]]
name = "oauth"
required-features = ["testing"]

[lints]
workspace = true

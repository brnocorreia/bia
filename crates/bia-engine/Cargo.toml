[package]
name = "bia-engine"
description = "Interpreter, Worker loop, scheduler loop and Trigger dispatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bia-core.workspace = true
bia-store.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
bia-core = { workspace = true, features = ["testing"] }
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }

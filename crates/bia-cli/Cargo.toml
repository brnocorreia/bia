[package]
name = "bia-cli"
description = "The bia binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bia-core.workspace = true
bia-store.workspace = true
bia-engine.workspace = true
bia-actions.workspace = true
bia-server.workspace = true
bia-client.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["serde"] }
sqlx.workspace = true
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
bia-core = { workspace = true, features = ["testing"] }
figment = { version = "0.10.19", features = ["env", "toml", "test"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true

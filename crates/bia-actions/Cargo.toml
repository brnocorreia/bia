[package]
name = "bia-actions"
description = "Builtin Actions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
bia-core.workspace = true
jsonschema = { version = "0.59.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros"] }

[dev-dependencies]

tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
wiremock = "0.6.5"

[lints]
workspace = true

# Dependency policy, checked by `just deny`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `keyring` reaches the Secret Service on Linux (`bia login`) through `zbus` 5, whose helper
# crates `zbus_names`, `zvariant` and `zvariant_derive` were folded into `zbus` 6. These are
# notices that the old crates stopped, not vulnerabilities; drop the entries once `keyring`
# moves to `zbus` 6.
# `rsa` has no patched release. It arrives only through `webauthn-rs` (crypto-glue) and bia only
# uses it to verify passkey signatures with public keys. The Marvin attack needs private-key
# operations (decryption or signing), which bia never performs with it.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "its crates merged into zbus 6; unmaintained notice only" },
    { id = "RUSTSEC-2026-0371", reason = "its crates merged into zbus 6; unmaintained notice only" },
    { id = "RUSTSEC-2026-0372", reason = "its crates merged into zbus 6; unmaintained notice only" },
    { id = "RUSTSEC-2023-0071", reason = "rsa only verifies passkey signatures; no private-key operation" },
]

[licenses]
version = 2
# Permissive licences compatible with distributing bia as MIT OR Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft. `option-ext` is unmodified and only runs inside the
# `rust-embed` proc macro (via `shellexpand`) at compile time, so it is not in the binary.
# The `webauthn-rs` family and `crypto-glue` are unmodified dependencies; MPL-2.0 only obliges
# sharing changes to those files, and bia changes none.
exceptions = [
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
    { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
    { crate = "crypto-glue", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crate dependency edges from docs/architecture.md. `wrappers` lists the only
# crates allowed to depend on each one directly.
deny = [
    { crate = "bia-store", wrappers = ["bia-engine", "bia-server", "bia-cli"] },
    { crate = "bia-engine", wrappers = ["bia-server", "bia-cli"] },
    { crate = "bia-actions", wrappers = ["bia-cli"] },
    { crate = "bia-server", wrappers = ["bia-cli"] },
    # bia-server only as a dev-dependency, for HTTP API tests.
    { crate = "bia-client", wrappers = ["bia-server", "bia-cli"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt-check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just clippy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bia
          POSTGRES_PASSWORD: bia
          POSTGRES_DB: bia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bia -d bia"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bia:bia@localhost:5432/bia
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just deny

  ui:
    name: ui
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bia
          POSTGRES_PASSWORD: bia
          POSTGRES_DB: bia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bia -d bia"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      BIA_E2E_DATABASE_URL: postgres://bia:bia@localhost:5432/bia_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm typecheck
        working-directory: ui
      - run: pnpm lint
        working-directory: ui
      - run: pnpm test
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: API types match the committed OpenAPI document
        run: pnpm check:api
        working-directory: ui
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build bia for the end-to-end tests
        run: cargo build -p bia-cli --locked
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - run: pnpm exec playwright test
        working-directory: ui
        env:
          BIA_E2E_BIN: ${{ github.workspace }}/target/debug/bia
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
